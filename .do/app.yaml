# DigitalOcean App Platform spec.
# Create -> Apps -> your GitHub repo -> "Edit Plan" -> import this, or just make
# sure the component type is WORKER (not Web Service).
#
# A long-polling bot never binds a port. A Web Service health-checks the port,
# finds nothing, and restarts the container forever. Worker has no health check.
name: telegram-video-broadcaster

workers:
  - name: broadcaster
    github:
      # owner/repo — App Platform rejects a full https:// URL here.
      repo: 250262-coder/telegram-video-broadcaster
      branch: main
      deploy_on_push: true

    dockerfile_path: Dockerfile
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb

    # The four SECRET keys have no value here on purpose — fill them in under
    # Settings -> your component -> Environment Variables in the dashboard.
    # App Platform encrypts them there; leaving them out keeps them off GitHub.
    envs:
      - key: BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: VAULT_CHAT_ID
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_IDS
        scope: RUN_TIME
        type: SECRET
      - key: INTERVAL_HOURS
        scope: RUN_TIME
        value: "4"
      - key: DELAY_BETWEEN_GROUPS
        scope: RUN_TIME
        value: "2.0"
      - key: CAPTION_SUFFIX
        scope: RUN_TIME
        value: ""
